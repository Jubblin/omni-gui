name: Auto-increment Version Label on PR

on:
  pull_request:
    # types: [opened, synchronize, reopened, closed, edited]
    branches:
      - main
      - dev
      - renovate/**
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to bump version on"
        required: true
        type: string
        default: "main"

permissions:
  contents: read
  pull-requests: write

jobs:
  bump-version-label:
    name: Update Version Label
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      (github.event.pull_request.base.ref == 'main' || 
      github.event.pull_request.base.ref == 'dev' || 
      github.event.pull_request.base.ref == 'renovate/**') ||
      (github.event.pull_request.base.ref == 'main' || 
      github.event.pull_request.base.ref == 'dev' || 
      github.event.pull_request.base.ref == 'renovate/**')


    steps:
      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Get base version from main branch
        id: base-version
        run: |
          BASE_VERSION=$(cat VERSION 2>/dev/null || echo "0.0.1")
          echo "base-version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "Base version from main: $BASE_VERSION"

      - name: Get existing version label from PR
        id: existing-label
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const versionLabelPattern = /^v\d+\.\d+\.\d+$/;
            const versionLabel = issue.labels.find(label => versionLabelPattern.test(label.name));

            if (versionLabel) {
              core.setOutput('label', versionLabel.name);
              core.setOutput('version', versionLabel.name.replace(/^v/, ''));
            } else {
              core.setOutput('label', '');
              core.setOutput('version', '');
            }

      - name: Calculate version for label
        id: version-check
        run: |
          BASE_VERSION="${{ steps.base-version.outputs.base-version }}"
          EXISTING_VERSION="${{ steps.existing-label.outputs.version }}"

          # Parse base version components
          IFS='.' read -r BASE_MAJOR BASE_MINOR BASE_PATCH <<< "$BASE_VERSION"

          # Check if PR already has a version label
          if [ -n "$EXISTING_VERSION" ] && [[ "$EXISTING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IFS='.' read -r EXISTING_MAJOR EXISTING_MINOR EXISTING_PATCH <<< "$EXISTING_VERSION"
            
            # If existing version is already higher than base, use it
            if [ "$EXISTING_MAJOR" -gt "$BASE_MAJOR" ] || \
               ([ "$EXISTING_MAJOR" -eq "$BASE_MAJOR" ] && [ "$EXISTING_MINOR" -gt "$BASE_MINOR" ]) || \
               ([ "$EXISTING_MAJOR" -eq "$BASE_MAJOR" ] && [ "$EXISTING_MINOR" -eq "$BASE_MINOR" ] && [ "$EXISTING_PATCH" -gt "$BASE_PATCH" ]); then
              echo "Using existing version label: $EXISTING_VERSION"
              echo "needs-update=false" >> $GITHUB_OUTPUT
              echo "new-version=$EXISTING_VERSION" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            # If existing version equals base version, increment it
            if [ "$EXISTING_MAJOR" -eq "$BASE_MAJOR" ] && [ "$EXISTING_MINOR" -eq "$BASE_MINOR" ] && [ "$EXISTING_PATCH" -eq "$BASE_PATCH" ]; then
              echo "Existing version equals base version, incrementing..."
            fi
          fi

          # Increment patch version from base
          NEW_PATCH=$((BASE_PATCH + 1))
          NEW_VERSION="${BASE_MAJOR}.${BASE_MINOR}.${NEW_PATCH}"
          echo "needs-update=true" >> $GITHUB_OUTPUT
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Calculated new version: $NEW_VERSION"

      - name: Update version label on PR
        if: steps.version-check.outputs.needs-update == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = '${{ steps.version-check.outputs.new-version }}';
            const versionLabel = `v${version}`;

            // Get current labels
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const currentLabels = issue.labels.map(label => label.name);

            // Remove any existing version labels (format: vX.Y.Z)
            const versionLabelPattern = /^v\d+\.\d+\.\d+$/;
            const labelsToRemove = currentLabels.filter(label => versionLabelPattern.test(label));

            // Remove old version labels
            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label,
                });
                console.log(`Removed old version label: ${label}`);
              } catch (error) {
                console.log(`Could not remove label ${label}:`, error.message);
              }
            }

            // Add new version label
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [versionLabel],
              });
              console.log(`✅ Added version label: ${versionLabel}`);
            } catch (error) {
              console.log(`Could not add label ${versionLabel}:`, error.message);
            }

      - name: Comment on PR (version label updated)
        if: steps.version-check.outputs.needs-update == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Check if we already commented on this PR
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Version Label Updated')
            );

            if (!botComment) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `✅ **Version Label Updated**

            Version label has been automatically updated from \`${{ steps.base-version.outputs.base-version }}\` to \`${{ steps.version-check.outputs.new-version }}\`.

            The version label \`v${{ steps.version-check.outputs.new-version }}\` has been added to this PR.

            Note: Version is set via ldflags at build time from the PR label.`
              });
            }

      - name: Comment on PR (no update needed)
        if: steps.version-check.outputs.needs-update == 'false'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Check if we already commented on this PR
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Version Label Check')
            );

            if (!botComment) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `ℹ️ **Version Label Check**

            Version label is already set: \`v${{ steps.version-check.outputs.new-version }}\`

            No label update needed.`
              });
            }
