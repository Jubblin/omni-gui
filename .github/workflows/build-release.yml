name: Build and Release

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch to build and release"
        required: true
        type: string
        default: "main"
  pull_request:
    types: [closed, labeled]
    branches:
      - main
      - dev

jobs:
  check-pr:
    name: Check PR and Extract Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: |
      (github.event.action == 'closed' && github.event.pull_request.merged == true) ||
      (github.event.action == 'labeled')
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-release: ${{ steps.check.outputs.should-release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get PR labels
        id: labels
        run: |
          if [ "${{ github.event.action }}" == "labeled" ]; then
            LABEL="${{ github.event.label.name }}"
          else
            # Get all labels and find one matching version pattern
            LABEL=$(gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name' | grep -E '^(release:|v?)[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "")
          fi
          echo "label=$LABEL" >> $GITHUB_OUTPUT
          echo "Found label: $LABEL"

      - name: Extract version from label or trigger version-bump
        id: version
        run: |
          LABEL="${{ steps.labels.outputs.label }}"

          # If no label found, trigger version-bump workflow and wait for it
          if [ -z "$LABEL" ]; then
            echo "No release label found, triggering version-bump workflow..."
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            
            # Check if version-bump workflow is already running for this PR
            RUNNING_RUN=$(gh run list --workflow="version-bump.yml" --limit 10 --json databaseId,status,conclusion,headBranch,event --jq ".[] | select((.headBranch == \"${{ github.event.pull_request.head.ref }}\" or .event == \"pull_request\") and (.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\")) | .databaseId" | head -1)
            
            if [ -n "$RUNNING_RUN" ]; then
              echo "Version-bump workflow already running (run ID: $RUNNING_RUN), waiting for completion..."
              WORKFLOW_RUN_ID="$RUNNING_RUN"
            else
              # Trigger version-bump workflow via workflow_dispatch
              echo "Triggering version-bump workflow..."
              WORKFLOW_OUTPUT=$(gh workflow run "version-bump.yml" \
                --ref "$BASE_REF" \
                --field branch="$BASE_REF" 2>&1)
              
              if [ $? -ne 0 ]; then
                echo "Failed to trigger version-bump workflow: $WORKFLOW_OUTPUT"
                # Try to find the run that was just created
                sleep 3
                WORKFLOW_RUN_ID=$(gh run list --workflow="version-bump.yml" --branch="$BASE_REF" --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")
              else
                echo "Version-bump workflow triggered successfully"
                # Get the run ID
                sleep 3
                WORKFLOW_RUN_ID=$(gh run list --workflow="version-bump.yml" --branch="$BASE_REF" --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")
              fi
            fi
            
            if [ -z "$WORKFLOW_RUN_ID" ]; then
              echo "Could not determine version-bump workflow run ID"
              exit 1
            fi
            
            echo "Waiting for version-bump workflow run $WORKFLOW_RUN_ID to complete..."
            
            # Wait for the workflow to complete (max 3 minutes, check every 5 seconds)
            MAX_WAIT=180
            ELAPSED=0
            while [ $ELAPSED -lt $MAX_WAIT ]; do
              sleep 5
              ELAPSED=$((ELAPSED + 5))
              
              # Check workflow run status
              RUN_INFO=$(gh run view "$WORKFLOW_RUN_ID" --json status,conclusion --jq '.status + "," + (.conclusion // "null")' 2>/dev/null || echo "unknown,null")
              
              STATUS=$(echo "$RUN_INFO" | cut -d',' -f1)
              CONCLUSION=$(echo "$RUN_INFO" | cut -d',' -f2)
              
              if [ "$STATUS" == "completed" ]; then
                if [ "$CONCLUSION" == "success" ]; then
                  echo "Version-bump workflow completed successfully"
                  break
                elif [ "$CONCLUSION" == "failure" ] || [ "$CONCLUSION" == "cancelled" ]; then
                  echo "Version-bump workflow failed or was cancelled: $CONCLUSION"
                  exit 1
                fi
              fi
              
              echo "Waiting for version-bump workflow... (${ELAPSED}s/${MAX_WAIT}s) - Status: $STATUS"
            done
            
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "Timeout waiting for version-bump workflow to complete"
              exit 1
            fi
            
            # Wait a bit more for label to be applied
            echo "Waiting for label to be applied..."
            sleep 5
            
            # Re-check PR labels after version-bump completes
            echo "Re-checking PR labels after version-bump..."
            LABEL=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -E '^(release:|v?)[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "")
            
            if [ -z "$LABEL" ]; then
              echo "Still no release label found after version-bump workflow completed"
              echo "Available labels:"
              gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' || true
              exit 1
            fi
            
            echo "Found label after version-bump: $LABEL"
          fi

          # Extract version from label (handles formats like "release:0.0.11", "v0.0.11", "0.0.11")
          # Remove "release:" prefix if present, then remove "v" prefix if present
          VERSION=$(echo "$LABEL" | sed -E 's/^release://' | sed -E 's/^v//')

          # Validate version format (must be X.Y.Z)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version format extracted from label: $LABEL -> $VERSION"
            echo "Expected format: X.Y.Z (e.g., 0.0.11)"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Check if should release
        id: check
        run: |
          # Ensure PR is targeting main branch
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ "$BASE_REF" != "main" ]; then
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "PR is not targeting main branch (targeting: $BASE_REF)"
            exit 0
          fi

          if [ "${{ github.event.action }}" == "closed" ] && [ "${{ github.event.pull_request.merged }}" == "true" ]; then
            echo "should-release=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.action }}" == "labeled" ]; then
            # Only release if PR is merged
            MERGED=$(gh pr view ${{ github.event.pull_request.number }} --json merged --jq '.merged')
            if [ "$MERGED" == "true" ]; then
              echo "should-release=true" >> $GITHUB_OUTPUT
            else
              echo "should-release=false" >> $GITHUB_OUTPUT
              echo "PR is not merged yet"
            fi
          else
            echo "should-release=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: Run Tests
    needs: check-pr
    if: needs.check-pr.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'main' }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      # - name: Run tests
      #   run: go test ./...

  build:
    name: Build Binaries
    needs:
      - check-pr
      - test
    if: needs.check-pr.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
          # - os: linux
          #   arch: arm64
          #   goos: linux
          #   goarch: arm64
          # - os: darwin
          #   arch: amd64
          #   goos: darwin
          #   goarch: amd64
          - os: darwin
            arch: arm64
            goos: darwin
            goarch: arm64
          # - os: windows
          #   arch: amd64
          #   goos: windows
          #   goarch: amd64
          # - os: windows
          #   arch: arm64
          #   goos: windows
          #   goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'main' }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Get version
        id: version
        run: |
          VERSION="${{ needs.check-pr.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OS="${{ matrix.os }}"
          ARCH="${{ matrix.arch }}"

          if [ "${{ matrix.goos }}" == "windows" ]; then
            OUTPUT_NAME="omni-gui-${VERSION}-${OS}-${ARCH}.exe"
          else
            OUTPUT_NAME="omni-gui-${VERSION}-${OS}-${ARCH}"
          fi

          mkdir -p dist
          # Set version via ldflags for both main package and handlers package
          go build -ldflags "-X github.com/jubblin/omni-api/main.Version=${VERSION} -X github.com/jubblin/omni-api/internal/api/handlers.Version=${VERSION}" -o "dist/${OUTPUT_NAME}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: omni-gui-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  release:
    name: Create Release
    needs: [check-pr, build]
    if: needs.check-pr.outputs.should-release == 'true' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          VERSION="${{ needs.check-pr.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create and push tag
        run: |
          TAG="v${{ needs.check-pr.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          find . -type f -name "omni-gui-*" -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## Release ${{ steps.version.outputs.tag }}

            ### Binaries

            This release includes pre-built binaries for the following platforms:

            - **Linux**: amd64, arm64
            - **macOS**: amd64, arm64
            - **Windows**: amd64, arm64

            ### Checksums

            See `checksums.txt` for SHA256 checksums of all binaries.

            ### Installation

            1. Download the appropriate binary for your platform
            2. Make it executable (Linux/macOS): `chmod +x omni-gui-*`
            3. Run: `./omni-gui-*` (or `omni-gui-*.exe` on Windows)
          files: |
            dist/**/*
          draft: false
          prerelease: false
